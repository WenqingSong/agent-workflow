$:
  vscode:
    - name: workflow-dev
      runner:
        cpus: 8
      services:
        - vscode
      docker:
        image: docker.cnb.cool/arthur-cloud-native/jetbrains/goland:5.0.1
      stages:
        - name: verify-engine
          script: |
            go version
            git --version
            GOWORK=off go -C .agent/engine test ./...
