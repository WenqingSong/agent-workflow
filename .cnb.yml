# Workflow V4.0.0 CI
#
# 设计原则：
#   1. V4 没有 Engine，CI 中不存在任何二进制构建步骤；
#   2. 只有 v4.0.0 这个精确 Tag 能触发正式发布，不使用通配；
#   3. 发布资产 5 项：源码包、源码包校验文件、Release Notes、SHA256SUMS、version.json；
#   4. 先 pre-release 上传并回读校验，通过后才 promote，再回读，最后才 latest；
#   5. 任一步失败即非零退出，不会留下错误的 GA 标记。
#
# 平台行为不确定项：attachments 插件的 DOWNLOAD 是否接受精确文件名列表。
# 因此下载阶段使用精确文件名，且上传后与 promote 后都重新下载核对，
# 不依赖「插件退出码为 0」推断附件存在。

.dev-config: &dev-config
  - name: workflow-dev
    runner:
      cpus: 8
    services:
      - vscode
    docker:
      image: docker.cnb.cool/arthur-cloud-native/jetbrains/goland:5.0.1
    stages:
      - name: verify-framework
        script: |
          set -euo pipefail
          git --version
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends python3
          fi
          python3 --version
          python3 -m unittest discover -s .agent/adoption/tests -v
          python3 -m unittest discover -s scripts/release/tests -v
          python3 .agent/adoption/workflow_adoption.py check --repo .
          go version
          GOWORK=off go -C dogfood/ledgerd vet ./...

$:
  vscode: *dev-config

# ---------------------------------------------------------------------------
# v4.0.0 分支：每次推送运行完整验证，确保分支可发布
# ---------------------------------------------------------------------------
v4.0.0:
  push:
    - name: verify-v4-branch
      runner:
        cpus: 4
      docker:
        image: golang:1.24
      stages:
        - name: preflight
          script: |
            set -euo pipefail
            go version
            git --version
            if ! command -v python3 >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends python3
            fi
            python3 --version
            command -v sha256sum

        - name: framework-tests
          script: |
            set -euo pipefail
            python3 -m unittest discover -s .agent/adoption/tests -v
            python3 -m unittest discover -s scripts/release/tests -v
            python3 .agent/adoption/workflow_adoption.py check --repo . --json

        - name: dogfood-tests
          script: |
            set -euo pipefail
            export GOWORK=off
            go -C dogfood/ledgerd vet ./...
            go -C dogfood/ledgerd test ./... -count=1
            go -C dogfood/ledgerd test -race ./... -count=1
            go -C dogfood/ledgerd build ./...

  # -------------------------------------------------------------------------
  # v4.0.0 Tag：正式发布流水线
  # -------------------------------------------------------------------------
  tag_push:
    - name: release-v4.0.0
      runner:
        cpus: 8
      docker:
        image: golang:1.24
      env:
        RELEASE_TAG: v4.0.0
      stages:
        - name: toolchain-preflight
          script: |
            set -euo pipefail
            git --version
            if ! command -v python3 >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends python3
            fi
            python3 --version
            command -v sha256sum

        # 预期 Commit 优先来自 CNB_COMMIT；缺失时用 Git 对 Tag 的真实解析结果。
        - name: tag-guard
          script: |
            set -euo pipefail
            test "${CNB_BRANCH:-}" = "${RELEASE_TAG}" || {
              echo "BLOCKED: 触发 Tag '${CNB_BRANCH:-<empty>}' 不是授权版本 '${RELEASE_TAG}'"
              exit 1
            }
            if [ -n "${CNB_COMMIT:-}" ]; then
              EXPECTED_COMMIT="${CNB_COMMIT}"
              EXPECTED_SOURCE="CNB_COMMIT"
            else
              EXPECTED_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
              EXPECTED_SOURCE="git-tag-resolution"
              echo "CNB_COMMIT 不可用：改用 Tag ${RELEASE_TAG} 的 Git 解析结果 ${EXPECTED_COMMIT}"
            fi
            python3 scripts/release/release.py guard \
              --repo . \
              --tag "${RELEASE_TAG}" \
              --expected-commit "${EXPECTED_COMMIT}" \
              --expected-commit-source "${EXPECTED_SOURCE}" \
              --report dist/reports/guard.json \
              --json

        - name: framework-verification
          script: |
            set -euo pipefail
            python3 -m unittest discover -s .agent/adoption/tests -v
            python3 -m unittest discover -s scripts/release/tests -v
            python3 .agent/adoption/workflow_adoption.py check --repo . --json

        - name: dogfood-verification
          script: |
            set -euo pipefail
            export GOWORK=off
            go -C dogfood/ledgerd vet ./...
            go -C dogfood/ledgerd test ./... -count=1
            go -C dogfood/ledgerd test -race ./... -count=1

        - name: build-assets
          script: |
            set -euo pipefail
            python3 scripts/release/release.py build \
              --repo . \
              --output dist \
              --tag "${RELEASE_TAG}" \
              --report dist/reports/build.json \
              --json

        - name: verify-assets-local
          script: |
            set -euo pipefail
            if [ -n "${CNB_COMMIT:-}" ]; then
              EXPECTED_COMMIT="${CNB_COMMIT}"
            else
              EXPECTED_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            fi
            python3 scripts/release/release.py verify \
              --dir dist \
              --repo . \
              --version "${RELEASE_TAG#v}" \
              --tag "${RELEASE_TAG}" \
              --commit "${EXPECTED_COMMIT}" \
              --report dist/reports/local-verification.json \
              --json

        - name: check-pipeline-coverage
          script: |
            set -euo pipefail
            python3 scripts/release/release.py check-pipeline \
              --config .cnb.yml \
              --repo . \
              --tag "${RELEASE_TAG}" \
              --report dist/reports/pipeline-coverage.json \
              --json

        - name: create-pre-release
          type: git:release
          options:
            title: Workflow V4.0.0
            descriptionFromFile: dist/agent-workflow-release-notes-4.0.0.md
            preRelease: true
            latest: false
            overlying: true

        - name: upload-assets
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_BRANCH
            attachments:
              - "./dist/agent-workflow-src-4.0.0.tar.gz"
              - "./dist/agent-workflow-src-4.0.0.tar.gz.sha256"
              - "./dist/agent-workflow-release-notes-4.0.0.md"
              - "./dist/SHA256SUMS"
              - "./dist/version.json"

        - name: download-uploaded
          image: cnbcool/attachments:latest
          settings:
            type: DOWNLOAD
            tag: $CNB_BRANCH
            attachments: "agent-workflow-src-4.0.0.tar.gz,agent-workflow-src-4.0.0.tar.gz.sha256,agent-workflow-release-notes-4.0.0.md,SHA256SUMS,version.json"

        - name: verify-uploaded
          script: |
            set -euo pipefail
            if [ -n "${CNB_COMMIT:-}" ]; then
              EXPECTED_COMMIT="${CNB_COMMIT}"
            else
              EXPECTED_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            fi
            python3 scripts/release/release.py verify-uploaded \
              --downloads . \
              --manifest dist/reports/local-verification.json \
              --commit "${EXPECTED_COMMIT}" \
              --report dist/reports/upload-verification.json \
              --json

        - name: promote-ga
          type: git:release
          options:
            title: Workflow V4.0.0
            descriptionFromFile: dist/agent-workflow-release-notes-4.0.0.md
            preRelease: false
            latest: false
            overlying: true

        - name: reupload-after-promote
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_BRANCH
            attachments:
              - "./dist/agent-workflow-src-4.0.0.tar.gz"
              - "./dist/agent-workflow-src-4.0.0.tar.gz.sha256"
              - "./dist/agent-workflow-release-notes-4.0.0.md"
              - "./dist/SHA256SUMS"
              - "./dist/version.json"

        - name: redownload-after-promote
          image: cnbcool/attachments:latest
          settings:
            type: DOWNLOAD
            tag: $CNB_BRANCH
            attachments: "agent-workflow-src-4.0.0.tar.gz,agent-workflow-src-4.0.0.tar.gz.sha256,agent-workflow-release-notes-4.0.0.md,SHA256SUMS,version.json"

        - name: verify-after-promote
          script: |
            set -euo pipefail
            if [ -n "${CNB_COMMIT:-}" ]; then
              EXPECTED_COMMIT="${CNB_COMMIT}"
            else
              EXPECTED_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            fi
            python3 scripts/release/release.py verify-uploaded \
              --downloads . \
              --manifest dist/reports/local-verification.json \
              --commit "${EXPECTED_COMMIT}" \
              --report dist/reports/post-promote-verification.json \
              --json

        - name: mark-latest
          type: git:release
          options:
            title: Workflow V4.0.0
            descriptionFromFile: dist/agent-workflow-release-notes-4.0.0.md
            preRelease: false
            latest: true
            overlying: true

        - name: redownload-after-latest
          image: cnbcool/attachments:latest
          settings:
            type: DOWNLOAD
            tag: $CNB_BRANCH
            attachments: "agent-workflow-src-4.0.0.tar.gz,agent-workflow-src-4.0.0.tar.gz.sha256,agent-workflow-release-notes-4.0.0.md,SHA256SUMS,version.json"

        - name: verify-after-latest
          script: |
            set -euo pipefail
            if [ -n "${CNB_COMMIT:-}" ]; then
              EXPECTED_COMMIT="${CNB_COMMIT}"
            else
              EXPECTED_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            fi
            python3 scripts/release/release.py verify-uploaded \
              --downloads . \
              --manifest dist/reports/local-verification.json \
              --commit "${EXPECTED_COMMIT}" \
              --report dist/reports/final-verification.json \
              --json

        - name: release-verification-report
          script: |
            set -euo pipefail
            python3 scripts/release/release.py report \
              --reports dist/reports \
              --require-all

# ---------------------------------------------------------------------------
# main 分支 push：单向镜像到 GitHub（https://github.com/WenqingSong/agent-workflow）
#
# 凭据来自私有密钥仓库；CNB 是唯一写入方，GitHub 是只读影子。
# 推送后回读 GitHub 侧 refs/heads/main，与本地 HEAD 逐字比对。
# ---------------------------------------------------------------------------
main:
  vscode: *dev-config
  push:
    - name: mirror-to-github
      imports: https://cnb.cool/framework-station/agent-workflow-password/-/blob/main/github-mirror.yml
      docker:
        image: golang:1.24
      env:
        MIRROR_TARGET: WenqingSong/agent-workflow
        MIRROR_BRANCH: main
      stages:
        - name: mirror-preflight
          script: |
            set -euo pipefail
            : "${GITHUB_USERNAME:?GITHUB_USERNAME 未注入：检查 github-mirror.yml 的 allow_slugs / allow_events / allow_branches}"
            : "${GITHUB_TOKEN:?GITHUB_TOKEN 未注入：检查密钥仓库 github-mirror.yml}"
            if [ "${CNB_BRANCH:-}" != "${MIRROR_BRANCH}" ]; then
              echo "BLOCKED: 只镜像 ${MIRROR_BRANCH} 分支，当前触发分支 '${CNB_BRANCH:-<empty>}'"
              exit 1
            fi
            git config --global --add safe.directory "$PWD"
            git --version
            echo "本地 HEAD: $(git rev-parse HEAD)"
            echo "目标: https://github.com/${MIRROR_TARGET} refs/heads/${MIRROR_BRANCH}"
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "检测到浅克隆，补全历史"
              git fetch --unshallow --tags origin \
                || echo "WARNING: 补全历史失败，继续尝试推送"
            fi

        - name: mirror-push
          script: |
            set -euo pipefail
            AUTH="AUTHORIZATION: basic $(printf '%s:%s' "${GITHUB_USERNAME}" "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            REMOTE_URL="https://github.com/${MIRROR_TARGET}.git"
            export GIT_TERMINAL_PROMPT=0
            git config --global --add safe.directory "$PWD"
            git remote remove github >/dev/null 2>&1 || true
            git remote add github "${REMOTE_URL}"
            git -c http.extraheader="${AUTH}" push --force github "HEAD:refs/heads/${MIRROR_BRANCH}"
            git -c http.extraheader="${AUTH}" push --force --tags github

        - name: mirror-verify
          script: |
            set -euo pipefail
            AUTH="AUTHORIZATION: basic $(printf '%s:%s' "${GITHUB_USERNAME}" "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            REMOTE_URL="https://github.com/${MIRROR_TARGET}.git"
            export GIT_TERMINAL_PROMPT=0
            LOCAL_SHA="$(git rev-parse HEAD)"
            REMOTE_SHA="$(git -c http.extraheader="${AUTH}" ls-remote "${REMOTE_URL}" "refs/heads/${MIRROR_BRANCH}" | awk '{print $1}')"
            echo "本地 HEAD          : ${LOCAL_SHA}"
            echo "GitHub ${MIRROR_BRANCH}         : ${REMOTE_SHA:-<empty>}"
            if [ "${REMOTE_SHA}" != "${LOCAL_SHA}" ]; then
              echo "FAILED: GitHub 侧 ${MIRROR_BRANCH} 与本次推送的 Commit 不一致"
              exit 1
            fi
            echo "OK: GitHub 镜像已对齐 ${LOCAL_SHA}"
